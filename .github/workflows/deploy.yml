name: Deploy to GitHub Pages

# Builds the Vite app and deploys ./dist with GitHub's native Pages actions.
#
# One-time repo setting this depends on:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Trigger: every push to `main`, or manually via "Run workflow".
# Nothing is written back to any branch; the artifact is deployed directly.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let in-progress ones finish instead of cancelling
# (cancelling mid-deploy can leave the Pages CDN serving a half-uploaded site).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Plain `npm ci` — it only works when package-lock.json matches
        # package.json, which is why the lockfile must be committed and
        # regenerated (`npm install`) whenever dependencies change.
        run: npm ci

      - name: Build
        # `base` is "/" by default, which is what a user site
        # (a-janjan.github.io) needs. For a project site, build with
        # VITE_BASE="/<repo>/" instead — see vite.config.js.
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
